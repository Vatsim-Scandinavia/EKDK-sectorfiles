name: Credential scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run scanner tests
        shell: pwsh
        run: ./tests/check_credentials.Tests.ps1

      - name: Scan tracked text files
        shell: pwsh
        run: ./scripts/check_credentials.ps1 -AllTracked
